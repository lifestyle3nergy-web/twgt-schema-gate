name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  registry-integrity:
    name: registry-integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Node registry integrity
        run: node contract-tests/registry-integrity/run-ts.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python registry integrity
        run: python3 contract-tests/registry-integrity/run-py.py

  schema-fixtures:
    name: schema-fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install jsonschema
        run: pip install --quiet jsonschema
      - name: Generate fixtures
        run: node contract-tests/generate-fixtures.mjs
      - name: Node schema fixtures
        run: node contract-tests/run-ts.mjs
      - name: Python schema fixtures
        run: python3 contract-tests/run-py.py

  differential:
    name: differential
    runs-on: ubuntu-latest
    needs: [registry-integrity, schema-fixtures]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node contract-tests/differential.mjs

  safety-gate:
    name: safety-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node contract-tests/safety-gate.mjs

  privacy:
    name: privacy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node contract-tests/privacy.mjs

  supply-chain:
    name: supply-chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node contract-tests/supply-chain.mjs

  reproducibility:
    name: reproducibility
    runs-on: ubuntu-latest
    needs: [supply-chain]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node contract-tests/reproducibility.mjs
