name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  registry-integrity:
    name: registry-integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Node registry integrity
        run: node contract-tests/registry-integrity/run-ts.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python registry integrity
        run: python3 contract-tests/registry-integrity/run-py.py

  schema-fixtures:
    name: schema-fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install jsonschema
        run: pip install --quiet jsonschema
      - name: Generate fixtures
        run: node contract-tests/generate-fixtures.mjs
      - name: Node schema fixtures
        run: node contract-tests/run-ts.mjs
      - name: Baseline reason-code contract
        run: node --test contract-tests/reason-codes.test.mjs
      - name: Python schema fixtures
        run: python3 contract-tests/run-py.py

  differential:
    name: differential
    runs-on: ubuntu-latest
    needs: [registry-integrity, schema-fixtures]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Differential normalization + divergence tests
        run: node --test contract-tests/differential/run.test.mjs

  safety-gate:
    name: safety-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Node safety gate
        run: node contract-tests/safety-gate/run-ts.mjs
      - name: Python safety gate
        run: python3 contract-tests/safety-gate/run-py.py

  privacy:
    name: privacy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Node privacy
        run: node contract-tests/privacy/run-ts.mjs
      - name: Python privacy
        run: python3 contract-tests/privacy/run-py.py

  supply-chain:
    name: supply-chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Node supply-chain
        run: node contract-tests/supply-chain/run-ts.mjs
      - name: Python supply-chain
        run: python3 contract-tests/supply-chain/run-py.py

  reproducibility:
    name: reproducibility
    runs-on: ubuntu-latest
    needs: [supply-chain]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Node reproducibility
        run: node contract-tests/reproducibility/run-ts.mjs
      - name: Python reproducibility
        run: python3 contract-tests/reproducibility/run-py.py
