name: evidence

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]

permissions:
  actions: read
  pull-requests: write
  contents: read

jobs:
  post-evidence:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request'

    steps:
      - name: Gather evidence
        id: gather
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail

          PR_NUMBER="$(gh api "/repos/${REPO}/commits/${HEAD_SHA}/pulls" \
            --jq '.[0].number // empty')"

          if [[ -z "${PR_NUMBER}" ]]; then
            echo "No open PR for ${HEAD_SHA} — nothing to comment on."
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHECKS="$(gh api "/repos/${REPO}/commits/${HEAD_SHA}/check-runs" \
            --jq '[.check_runs[] | "\(.name)=\(.conclusion // "pending")"] | join(", ")')"

          TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          {
            echo "skip=0"
            echo "pr_number=${PR_NUMBER}"
            echo "head_sha=${HEAD_SHA}"
            echo "run_url=${RUN_URL}"
            echo "run_id=${RUN_ID}"
            echo "conclusion=${CONCLUSION}"
            echo "checks=${CHECKS}"
            echo "timestamp=${TS}"
          } >> "$GITHUB_OUTPUT"

      - name: Post evidence comment
        if: steps.gather.outputs.skip == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.gather.outputs.pr_number }}
          HEAD_SHA: ${{ steps.gather.outputs.head_sha }}
          RUN_URL: ${{ steps.gather.outputs.run_url }}
          CONCLUSION: ${{ steps.gather.outputs.conclusion }}
          CHECKS: ${{ steps.gather.outputs.checks }}
          TS: ${{ steps.gather.outputs.timestamp }}
        run: |
          set -euo pipefail

          BODY="$(cat <<EOF
          ## CI Evidence (automated)

          This comment is generated by \`.github/workflows/evidence.yml\`.
          It records the evidence required by \`governance/README.md\` (G-01).
          **This is not an approval.** CI never self-approves.

          | Field | Value |
          |---|---|
          | Head SHA | \`${HEAD_SHA}\` |
          | CI run | ${RUN_URL} |
          | Conclusion | \`${CONCLUSION}\` |
          | Checks | \`${CHECKS}\` |
          | Recorded (UTC) | \`${TS}\` |

          ---

          ### Reviewer — acknowledge exactly this revision

          Reply with a comment that quotes the head SHA and the CI run URL.
          Example:

          \`\`\`
          Reviewed.
          head_sha=${HEAD_SHA}
          ci_run=${RUN_URL}
          Approved.
          \`\`\`

          The approval is your comment, not this one. If any commit lands
          after your approval, this comment is superseded and a new one
          is posted — the previous approval no longer applies.
          EOF
          )"

          gh pr comment "${PR}" --body "${BODY}"
